<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Compra</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #10b981;
      --dte-bg: rgba(245, 158, 11, 0.2);
      --dte-text: #fbbf24;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-bottom: 76px;
      user-select: none;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      padding: 10px 14px;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    /* Segmented control per canviar de vista dalt */
    .mode-switch {
      display: flex;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 3px;
      flex: 1;
    }

    .mode-btn {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-weight: 700;
      font-size: 0.88rem;
      padding: 7px 8px;
      border-radius: 7px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .mode-btn.active {
      background: var(--primary);
      color: #022c22;
    }

    .count-pill {
      background: rgba(0, 0, 0, 0.22);
      padding: 1px 7px;
      border-radius: 999px;
      font-size: 0.78rem;
    }

    .refresh-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      width: 38px;
      height: 38px;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .spinning { animation: spin 0.8s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    .filters-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .filters-bar::-webkit-scrollbar { display: none; }

    .chip {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 5px 11px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
    }

    .chip.active {
      background: #e2e8f0;
      border-color: #e2e8f0;
      color: #0f172a;
    }

    .chip.dte-chip.active {
      background: #f59e0b;
      border-color: #f59e0b;
      color: #1e1b04;
    }

    .search-wrap {
      margin-top: 10px;
    }

    .search-input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      padding: 9px 12px;
      font-size: 0.95rem;
      outline: none;
    }
    .search-input:focus { border-color: var(--primary); }

    main {
      padding: 10px 12px;
      max-width: 640px;
      margin: 0 auto;
    }

    .section-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      font-weight: 700;
      margin: 14px 4px 6px;
    }
    .section-label:first-child { margin-top: 2px; }

    .row {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 10px 12px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .row.selected {
      border-color: rgba(16, 185, 129, 0.5);
      background: rgba(16, 185, 129, 0.1);
    }

    .row-main {
      display: flex;
      align-items: center;
      gap: 11px;
      flex: 1;
      min-width: 0;
      cursor: pointer;
    }

    .checkbox {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      border: 2px solid var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 0.85rem;
      font-weight: 900;
      color: #022c22;
    }

    .row.selected .checkbox {
      background: var(--primary);
      border-color: var(--primary);
    }

    .row-title {
      font-size: 0.96rem;
      font-weight: 500;
      word-break: break-word;
    }

    .badges {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      margin-left: 6px;
      vertical-align: middle;
    }

    .badge {
      font-size: 0.68rem;
      font-weight: 800;
      padding: 1px 6px;
      border-radius: 5px;
    }

    .sup-Mer { background: rgba(16, 185, 129, 0.22); color: #34d399; }
    .sup-BA { background: rgba(239, 68, 68, 0.22); color: #f87171; }
    .sup-Plus { background: rgba(249, 115, 22, 0.22); color: #fb923c; }
    .sup-Al { background: rgba(59, 130, 246, 0.22); color: #60a5fa; }
    .sup-Li { background: rgba(234, 179, 8, 0.22); color: #fde047; }
    .sup-Esc { background: rgba(168, 85, 247, 0.22); color: #c084fc; }
    .badge-dte { background: var(--dte-bg); color: var(--dte-text); }

    .row-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .qty-pill {
      display: flex;
      align-items: center;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .qty-pill button {
      background: none;
      border: none;
      color: var(--text);
      width: 26px;
      height: 26px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }

    .qty-pill span {
      min-width: 18px;
      text-align: center;
      font-size: 0.82rem;
      font-weight: 700;
    }

    .edit-icon {
      background: none;
      border: none;
      color: var(--text-muted);
      padding: 4px 6px;
      font-size: 0.95rem;
      cursor: pointer;
    }

    .empty {
      text-align: center;
      padding: 44px 16px;
      color: var(--text-muted);
    }

    .fab {
      position: fixed;
      right: 18px;
      bottom: 20px;
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: var(--primary);
      color: #022c22;
      border: none;
      font-size: 1.8rem;
      font-weight: 700;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.5);
      cursor: pointer;
      z-index: 25;
    }

    /* Modal */
    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.8);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 50;
    }
    .modal-bg.open { display: flex; }

    .modal {
      background: var(--surface);
      border-top: 1px solid var(--border);
      border-radius: 18px 18px 0 0;
      width: 100%;
      max-width: 520px;
      padding: 18px 16px 24px;
    }

    .modal h2 { margin: 0 0 12px; font-size: 1.05rem; }

    .field { margin-bottom: 11px; }
    .field label { display: block; font-size: 0.78rem; color: var(--text-muted); margin-bottom: 4px; font-weight: 600; }
    .input, .select {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 9px;
      padding: 9px 11px;
      font-size: 0.95rem;
      outline: none;
    }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .check-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 9px 12px;
      border-radius: 9px;
      margin-bottom: 10px;
      font-size: 0.9rem;
    }
    .check-row input { width: 19px; height: 19px; accent-color: var(--primary); }

    .modal-btns { display: flex; gap: 8px; margin-top: 14px; }
    .btn {
      flex: 1;
      padding: 11px;
      border-radius: 9px;
      border: none;
      font-weight: 700;
      font-size: 0.92rem;
      cursor: pointer;
    }
    .btn-save { background: var(--primary); color: #022c22; }
    .btn-cancel { background: var(--bg); color: var(--text); border: 1px solid var(--border); }
    .btn-del { background: rgba(239, 68, 68, 0.18); color: var(--danger); flex: 0.45; }

    .toast {
      position: fixed;
      bottom: 84px;
      left: 50%;
      transform: translateX(-50%);
      background: #1e293b;
      border: 1px solid var(--primary);
      color: var(--text);
      padding: 7px 15px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 600;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>

  <div id="toast" class="toast"></div>

  <header>
    <div class="top-bar">
      <div class="mode-switch">
        <button class="mode-btn active" id="btn-mode-buy" onclick="setMode('buy')">
          🛒 A comprar <span class="count-pill" id="pending-count">0</span>
        </button>
        <button class="mode-btn" id="btn-mode-all" onclick="setMode('all')">
          📋 Tots els articles
        </button>
      </div>
      <button class="refresh-btn" onclick="loadData(true)" title="Sincronitzar">
        <span id="ref-icon">🔄</span>
      </button>
    </div>

    <div class="filters-bar" id="sup-bar">
      <button class="chip active" data-sup="ALL" onclick="setSup('ALL')">Tots</button>
      <button class="chip" data-sup="NONE" onclick="setSup('NONE')">Sense súper</button>
      <button class="chip" data-sup="Mer" onclick="setSup('Mer')">Mer</button>
      <button class="chip" data-sup="BA" onclick="setSup('BA')">BA</button>
      <button class="chip" data-sup="Plus" onclick="setSup('Plus')">Plus</button>
      <button class="chip" data-sup="Al" onclick="setSup('Al')">Al</button>
      <button class="chip" data-sup="Li" onclick="setSup('Li')">Li</button>
      <button class="chip" data-sup="Esc" onclick="setSup('Esc')">Esc</button>
      <button class="chip dte-chip" id="dte-btn" onclick="toggleDte()">🏷️ Dte</button>
    </div>

    <div class="search-wrap" id="search-wrap" style="display:none;">
      <input type="search" id="search" class="search-input" placeholder="Cercar o crear article..." oninput="render()" />
    </div>
  </header>

  <main id="list"></main>

  <button class="fab" onclick="openModal()" title="Nou article">+</button>

  <div class="modal-bg" id="modal-bg" onclick="if(event.target.id==='modal-bg') closeModal()">
    <div class="modal">
      <h2 id="modal-title">Nou article</h2>
      <input type="hidden" id="f-id" />

      <div class="field">
        <label>Producte</label>
        <input type="text" id="f-name" class="input" placeholder="Ex: Llet semidesnatada" />
      </div>

      <div class="grid-2">
        <div class="field">
          <label>Supermercat</label>
          <select id="f-sup" class="select">
            <option value="">Sense etiqueta</option>
            <option value="Mer">Mer (Mercadona)</option>
            <option value="BA">BA (BonÀrea)</option>
            <option value="Plus">Plus (PlusFresc)</option>
            <option value="Al">Al (Aldi)</option>
            <option value="Li">Li (Lidl)</option>
            <option value="Esc">Esc (Esclat)</option>
          </select>
        </div>
        <div class="field">
          <label>Passadís / Categoria</label>
          <select id="f-cat" class="select">
            <option value="Fruita i Verdura">Fruita i Verdura</option>
            <option value="Forn i Esmorzar">Forn i Esmorzar</option>
            <option value="Carn i Aus">Carn i Aus</option>
            <option value="Peix i Marisc">Peix i Marisc</option>
            <option value="Xarcuteria i Formatges">Xarcuteria i Formatges</option>
            <option value="Làctics i Begudes Vegetals">Làctics i Begudes Vegetals</option>
            <option value="Pasta, Arròs i Llegums">Pasta, Arròs i Llegums</option>
            <option value="Rebost i Conserves">Rebost i Conserves</option>
            <option value="Salses i Espècies">Salses i Espècies</option>
            <option value="Fruits Secs i Aperitius">Fruits Secs i Aperitius</option>
            <option value="Dolços i Xocolata">Dolços i Xocolata</option>
            <option value="Begudes">Begudes</option>
            <option value="Congelats i Preparats">Congelats i Preparats</option>
            <option value="Neteja i Llar">Neteja i Llar</option>
            <option value="Higiene i Farmàcia">Higiene i Farmàcia</option>
            <option value="Mascotes">Mascotes</option>
            <option value="Altres">Altres</option>
          </select>
        </div>
      </div>

      <div class="grid-2">
        <div class="field">
          <label>Quantitat</label>
          <input type="number" id="f-qty" class="input" min="1" value="1" />
        </div>
        <div class="field" style="display:flex; align-items:flex-end;">
          <label class="check-row" style="width:100%; margin-bottom:0;">
            <span>🏷️ Dte</span>
            <input type="checkbox" id="f-dte" />
          </label>
        </div>
      </div>

      <label class="check-row">
        <span>🛒 A la llista de compra</span>
        <input type="checkbox" id="f-buy" checked />
      </label>

      <div class="modal-btns">
        <button class="btn btn-del" id="btn-del" onclick="delItem()" style="display:none;">Esborrar</button>
        <button class="btn btn-cancel" onclick="closeModal()">Cancel·lar</button>
        <button class="btn btn-save" onclick="saveItem()">Desar</button>
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbylFLaLHF7kjaCIJ6duBuiafooVQGM4HoL5TUjDDJ-LCfgqYQwUlXMCOyzblj9-dR8q/exec';

    let items = [];
    let mode = 'buy'; // 'buy' | 'all'
    let supFilter = 'ALL'; // 'ALL' | 'NONE' | 'Mer' | 'BA' | 'Plus' | 'Al' | 'Li' | 'Esc'
    let dteFilter = false;

    const CAT_ORDER = [
      'Fruita i Verdura', 'Forn i Esmorzar', 'Carn i Aus', 'Peix i Marisc',
      'Xarcuteria i Formatges', 'Làctics i Begudes Vegetals', 'Pasta, Arròs i Llegums',
      'Rebost i Conserves', 'Salses i Espècies', 'Fruits Secs i Aperitius',
      'Dolços i Xocolata', 'Begudes', 'Congelats i Preparats',
      'Neteja i Llar', 'Higiene i Farmàcia', 'Mascotes', 'Altres'
    ];

    function toast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(window._t);
      window._t = setTimeout(() => el.classList.remove('show'), 1800);
    }

    async function loadData(manual = false) {
      const ic = document.getElementById('ref-icon');
      ic.classList.add('spinning');
      try {
        const res = await fetch(API_URL);
        const data = await res.json();
        if (data.status === 'ok') {
          items = data.items;
          localStorage.setItem('compra_v2', JSON.stringify(items));
          render();
          if (manual) toast('Actualitzat');
        }
      } catch (e) {
        toast('Mode sense connexió');
      } finally {
        ic.classList.remove('spinning');
      }
    }

    function send(payload) {
      return fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      }).catch(() => toast('Error desant'));
    }

    function setMode(m) {
      mode = m;
      document.getElementById('btn-mode-buy').classList.toggle('active', m === 'buy');
      document.getElementById('btn-mode-all').classList.toggle('active', m === 'all');
      document.getElementById('search-wrap').style.display = m === 'all' ? 'block' : 'none';
      if (m === 'all') document.getElementById('search').focus();
      render();
    }

    function setSup(s) {
      supFilter = s;
      document.querySelectorAll('#sup-bar .chip[data-sup]').forEach(b => {
        b.classList.toggle('active', b.dataset.sup === s);
      });
      render();
    }

    function toggleDte() {
      dteFilter = !dteFilter;
      document.getElementById('dte-btn').classList.toggle('active', dteFilter);
      render();
    }

    function toggleBuy(id) {
      const it = items.find(x => String(x.id) === String(id));
      if (!it) return;
      it.comprar = !it.comprar;
      if (it.comprar && (!it.quantitat || it.quantitat < 1)) it.quantitat = 1;
      localStorage.setItem('compra_v2', JSON.stringify(items));
      render();
      toast(it.comprar ? `+ ${it.producte}` : `✓ ${it.producte}`);
      send({ action: 'toggleComprar', id: it.id, comprar: it.comprar, quantitat: it.quantitat });
    }

    function stepQty(id, d, e) {
      e.stopPropagation();
      const it = items.find(x => String(x.id) === String(id));
      if (!it) return;
      if (it.quantitat + d < 1) { toggleBuy(id); return; }
      it.quantitat += d;
      localStorage.setItem('compra_v2', JSON.stringify(items));
      render();
      send({ action: 'updateItem', id: it.id, quantitat: it.quantitat });
    }

    function render() {
      const list = document.getElementById('list');
      document.getElementById('pending-count').textContent = items.filter(x => x.comprar).length;
      const q = (document.getElementById('search').value || '').trim().toLowerCase();

      const filtered = items.filter(it => {
        if (mode === 'buy' && !it.comprar) return false;
        if (dteFilter && !it.dte) return false;

        // Filtre estricte de supermercat
        if (supFilter === 'NONE') {
          if (it.supermercat !== '') return false;
        } else if (supFilter !== 'ALL') {
          if (it.supermercat !== supFilter) return false;
        }

        if (mode === 'all' && q) {
          return it.producte.toLowerCase().includes(q);
        }
        return true;
      });

      if (!filtered.length) {
        if (mode === 'buy') {
          list.innerHTML = `<div class="empty">✅ Cap article pendent amb aquest filtre.</div>`;
        } else {
          const rawQ = document.getElementById('search').value.trim();
          list.innerHTML = `<div class="empty">
            No hi ha cap article "${esc(rawQ)}".<br><br>
            <button class="btn btn-save" style="max-width:220px;" onclick="openModal(null, '${esc(rawQ).replace(/'/g, "\\'")}')">+ Afegir "${esc(rawQ)}"</button>
          </div>`;
        }
        return;
      }

      // Agrupem per passadís/categoria
      const groups = {};
      filtered.forEach(it => {
        const c = it.categoria || 'Altres';
        (groups[c] = groups[c] || []).push(it);
      });

      const cats = Object.keys(groups).sort((a, b) => {
        const ia = CAT_ORDER.indexOf(a), ib = CAT_ORDER.indexOf(b);
        return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
      });

      let html = '';
      cats.forEach(cat => {
        html += `<div class="section-label">${esc(cat)}</div>`;
        groups[cat].sort((a, b) => a.producte.localeCompare(b.producte, 'ca')).forEach(it => {
          const isSel = mode === 'all' && it.comprar;
          const supBadge = it.supermercat ? `<span class="badge sup-${esc(it.supermercat)}">${esc(it.supermercat)}</span>` : '';
          const dteBadge = it.dte ? `<span class="badge badge-dte">Dte</span>` : '';

          html += `
            <div class="row ${isSel ? 'selected' : ''}">
              <div class="row-main" onclick="toggleBuy('${it.id}')">
                <div class="checkbox">${isSel ? '✓' : ''}</div>
                <div class="row-title">
                  ${esc(it.producte)}
                  ${(supBadge || dteBadge) ? `<span class="badges">${supBadge}${dteBadge}</span>` : ''}
                </div>
              </div>
              <div class="row-actions">
                ${it.comprar ? `
                  <div class="qty-pill">
                    <button onclick="stepQty('${it.id}', -1, event)">−</button>
                    <span>${it.quantitat}</span>
                    <button onclick="stepQty('${it.id}', 1, event)">+</button>
                  </div>` : ''}
                <button class="edit-icon" onclick="openModal('${it.id}')">✏️</button>
              </div>
            </div>`;
        });
      });

      list.innerHTML = html;
    }

    function openModal(id = null, prefill = '') {
      const it = id ? items.find(x => String(x.id) === String(id)) : null;
      document.getElementById('modal-title').textContent = it ? 'Editar article' : 'Nou article';
      document.getElementById('f-id').value = it ? it.id : '';
      document.getElementById('f-name').value = it ? it.producte : prefill;
      document.getElementById('f-sup').value = it ? (it.supermercat || '') : (supFilter !== 'ALL' && supFilter !== 'NONE' ? supFilter : '');
      document.getElementById('f-cat').value = it ? (it.categoria || 'Altres') : 'Fruita i Verdura';
      document.getElementById('f-qty').value = it ? (it.quantitat || 1) : 1;
      document.getElementById('f-dte').checked = it ? !!it.dte : dteFilter;
      document.getElementById('f-buy').checked = it ? !!it.comprar : true;
      document.getElementById('btn-del').style.display = it ? 'block' : 'none';
      document.getElementById('modal-bg').classList.add('open');
      if (!it) setTimeout(() => document.getElementById('f-name').focus(), 80);
    }

    function closeModal() { document.getElementById('modal-bg').classList.remove('open'); }

    async function saveItem() {
      const id = document.getElementById('f-id').value;
      const producte = document.getElementById('f-name').value.trim();
      if (!producte) return;

      const data = {
        producte,
        supermercat: document.getElementById('f-sup').value,
        categoria: document.getElementById('f-cat').value,
        quantitat: Math.max(1, parseInt(document.getElementById('f-qty').value, 10) || 1),
        dte: document.getElementById('f-dte').checked,
        comprar: document.getElementById('f-buy').checked
      };

      closeModal();

      if (id) {
        const it = items.find(x => String(x.id) === String(id));
        if (it) Object.assign(it, data);
        localStorage.setItem('compra_v2', JSON.stringify(items));
        render();
        toast('Desat');
        await send({ action: 'updateItem', id, ...data });
      } else {
        const tmp = { id: 'tmp_' + Date.now(), ...data };
        items.push(tmp);
        render();
        toast('Afegit');
        const res = await send({ action: 'addItem', ...data });
        if (res) {
          const json = await res.json();
          if (json.id) tmp.id = json.id;
          localStorage.setItem('compra_v2', JSON.stringify(items));
        }
      }
    }

    async function delItem() {
      const id = document.getElementById('f-id').value;
      if (!id) return;
      items = items.filter(x => String(x.id) !== String(id));
      localStorage.setItem('compra_v2', JSON.stringify(items));
      closeModal();
      render();
      toast('Esborrat');
      await send({ action: 'deleteItem', id });
    }

    function esc(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') loadData(false);
    });

    const cache = localStorage.getItem('compra_v2');
    if (cache) { items = JSON.parse(cache); render(); }
    loadData(false);
  </script>
</body>
</html>
