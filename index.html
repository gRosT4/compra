<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Llista Compra</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-hover: #283548;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #10b981;
      --primary-dark: #059669;
      --dte-bg: rgba(245, 158, 11, 0.18);
      --dte-text: #fbbf24;
      --dte-border: rgba(245, 158, 11, 0.45);
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding-bottom: 84px;
      user-select: none;
    }

    /* Header */
    header {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px 10px;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge-count {
      background: var(--primary);
      color: #022c22;
      font-size: 0.78rem;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 999px;
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      padding: 7px 11px;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .icon-btn:active {
      transform: scale(0.96);
    }

    .spinning {
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    /* Filter chips */
    .filters-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .filters-bar::-webkit-scrollbar { display: none; }

    .chip {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 5px 11px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
    }

    .chip.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #022c22;
    }

    .chip.dte-filter.active {
      background: #f59e0b;
      border-color: #f59e0b;
      color: #1e1b04;
    }

    /* Search bar (Catalog view) */
    .search-box {
      padding: 10px 16px 0;
      display: flex;
      gap: 8px;
    }

    .search-input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.95rem;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--primary);
    }

    /* Main content */
    main {
      padding: 10px 14px;
      max-width: 680px;
      margin: 0 auto;
    }

    .category-group {
      margin-bottom: 18px;
    }

    .category-title {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      font-weight: 700;
      margin: 0 0 8px 4px;
      display: flex;
      justify-content: space-between;
    }

    .item-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      transition: background 0.15s, opacity 0.15s;
    }

    .item-card.in-cart {
      border-color: rgba(16, 185, 129, 0.45);
      background: rgba(16, 185, 129, 0.08);
    }

    .item-left {
      display: flex;
      align-items: center;
      gap: 11px;
      flex: 1;
      min-width: 0;
      cursor: pointer;
    }

    .check-circle {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 0.85rem;
      font-weight: 800;
      color: #022c22;
    }

    .item-card.checked-style .check-circle {
      background: var(--primary);
      border-color: var(--primary);
    }

    .item-info {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .item-name {
      font-size: 0.96rem;
      font-weight: 500;
      color: var(--text);
      word-break: break-word;
    }

    .item-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 4px;
    }

    .tag {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 1px 7px;
      border-radius: 6px;
      letter-spacing: 0.02em;
    }

    /* Supermarket colors */
    .sup-Mer { background: rgba(16, 185, 129, 0.2); color: #34d399; }
    .sup-BA { background: rgba(239, 68, 68, 0.2); color: #f87171; }
    .sup-Plus { background: rgba(249, 115, 22, 0.22); color: #fb923c; }
    .sup-Al { background: rgba(59, 130, 246, 0.22); color: #60a5fa; }
    .sup-Li { background: rgba(234, 179, 8, 0.22); color: #fde047; }
    .sup-Esc { background: rgba(168, 85, 247, 0.22); color: #c084fc; }

    .tag-dte {
      background: var(--dte-bg);
      color: var(--dte-text);
      border: 1px solid var(--dte-border);
    }

    .item-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .qty-box {
      display: flex;
      align-items: center;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }

    .qty-btn {
      background: transparent;
      border: none;
      color: var(--text);
      width: 28px;
      height: 28px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }

    .qty-btn:active {
      background: var(--surface-hover);
    }

    .qty-val {
      min-width: 20px;
      text-align: center;
      font-size: 0.85rem;
      font-weight: 700;
    }

    .edit-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 6px;
      font-size: 1rem;
      cursor: pointer;
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 48px 20px;
      color: var(--text-muted);
    }

    .empty-state p {
      margin: 8px 0 16px;
      font-size: 0.95rem;
    }

    /* Floating Action Button */
    .fab {
      position: fixed;
      right: 18px;
      bottom: 76px;
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: var(--primary);
      color: #022c22;
      border: none;
      font-size: 1.7rem;
      font-weight: 700;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
      cursor: pointer;
      z-index: 25;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .fab:active {
      transform: scale(0.94);
    }

    /* Bottom Navigation */
    nav.bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 62px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      z-index: 30;
    }

    .nav-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 600;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      cursor: pointer;
    }

    .nav-btn.active {
      color: var(--primary);
    }

    .nav-icon {
      font-size: 1.2rem;
    }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.78);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 50;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      background: var(--surface);
      border-top: 1px solid var(--border);
      border-radius: 18px 18px 0 0;
      width: 100%;
      max-width: 540px;
      padding: 20px 18px 26px;
      animation: slideUp 0.2s ease-out;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .modal h2 {
      margin: 0 0 14px;
      font-size: 1.1rem;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 5px;
      font-weight: 600;
    }

    .form-control {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.95rem;
      outline: none;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 10px 12px;
      border-radius: 10px;
      margin-bottom: 12px;
      cursor: pointer;
    }

    .toggle-row input[type="checkbox"] {
      width: 20px;
      height: 20px;
      accent-color: var(--primary);
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    .btn {
      flex: 1;
      padding: 11px;
      border-radius: 10px;
      border: none;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-primary {
      background: var(--primary);
      color: #022c22;
    }

    .btn-secondary {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-danger {
      background: rgba(239, 68, 68, 0.16);
      color: var(--danger);
      border: 1px solid rgba(239, 68, 68, 0.35);
      flex: 0.45;
    }

    /* Toast */
    .toast {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      background: #1e293b;
      border: 1px solid var(--primary);
      color: var(--text);
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
    }

    .toast.show {
      opacity: 1;
    }
  </style>
</head>
<body>

  <div id="toast" class="toast">Sincronitzant...</div>

  <header>
    <div class="header-top">
      <h1>
        <span id="header-title">🛒 A comprar</span>
        <span id="pending-badge" class="badge-count">0</span>
      </h1>
      <div class="header-actions">
        <button class="icon-btn" onclick="loadData(true)" title="Actualitzar llista">
          <span id="refresh-icon">🔄</span>
        </button>
      </div>
    </div>

    <div class="filters-bar" id="super-filters">
      <button class="chip active" data-sup="ALL" onclick="setSuperFilter('ALL')">Tots</button>
      <button class="chip" data-sup="Mer" onclick="setSuperFilter('Mer')">Mer</button>
      <button class="chip" data-sup="BA" onclick="setSuperFilter('BA')">BA</button>
      <button class="chip" data-sup="Plus" onclick="setSuperFilter('Plus')">Plus</button>
      <button class="chip" data-sup="Al" onclick="setSuperFilter('Al')">Al</button>
      <button class="chip" data-sup="Li" onclick="setSuperFilter('Li')">Li</button>
      <button class="chip" data-sup="Esc" onclick="setSuperFilter('Esc')">Esc</button>
      <button class="chip dte-filter" id="dte-chip" onclick="toggleDteFilter()">🏷️ Dte</button>
    </div>
  </header>

  <div class="search-box" id="search-container" style="display: none;">
    <input type="search" id="search-input" class="search-input" placeholder="Cercar producte o afegir-ne un de nou..." oninput="render()" />
  </div>

  <main id="app-content">
    <div class="empty-state">Carregant llista...</div>
  </main>

  <button class="fab" onclick="openAddModal()" title="Afegir article">+</button>

  <nav class="bottom-nav">
    <button class="nav-btn active" id="tab-buy" onclick="switchTab('buy')">
      <span class="nav-icon">🛒</span>
      <span>A comprar</span>
    </button>
    <button class="nav-btn" id="tab-catalog" onclick="switchTab('catalog')">
      <span class="nav-icon">📋</span>
      <span>Catàleg habitual</span>
    </button>
  </nav>

  <!-- Modal Add / Edit -->
  <div class="modal-backdrop" id="item-modal" onclick="closeModalOnBackdrop(event)">
    <div class="modal">
      <h2 id="modal-title">Nou article</h2>
      <input type="hidden" id="edit-id" />

      <div class="form-group">
        <label>Nom del producte</label>
        <input type="text" id="field-producte" class="form-control" placeholder="Ex: Llet semidesnatada" />
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Categoria</label>
          <select id="field-categoria" class="form-control">
            <option value="Fruita i Verdura">Fruita i Verdura</option>
            <option value="Carn i Aus">Carn i Aus</option>
            <option value="Peix i Marisc">Peix i Marisc</option>
            <option value="Xarcuteria i Formatges">Xarcuteria i Formatges</option>
            <option value="Làctics i Begudes Vegetals">Làctics i Begudes Vegetals</option>
            <option value="Forn i Esmorzar">Forn i Esmorzar</option>
            <option value="Pasta, Arròs i Llegums">Pasta, Arròs i Llegums</option>
            <option value="Rebost i Conserves">Rebost i Conserves</option>
            <option value="Salses i Espècies">Salses i Espècies</option>
            <option value="Begudes">Begudes</option>
            <option value="Fruits Secs i Aperitius">Fruits Secs i Aperitius</option>
            <option value="Dolços i Xocolata">Dolços i Xocolata</option>
            <option value="Congelats i Preparats">Congelats i Preparats</option>
            <option value="Neteja i Llar">Neteja i Llar</option>
            <option value="Higiene i Farmàcia">Higiene i Farmàcia</option>
            <option value="Mascotes">Mascotes</option>
            <option value="Altres">Altres</option>
          </select>
        </div>

        <div class="form-group">
          <label>Supermercat habitual</label>
          <select id="field-supermercat" class="form-control">
            <option value="">Qualsevol</option>
            <option value="Mer">Mer (Mercadona)</option>
            <option value="BA">BA (BonÀrea)</option>
            <option value="Plus">Plus (PlusFresc)</option>
            <option value="Al">Al (Aldi)</option>
            <option value="Li">Li (Lidl)</option>
            <option value="Esc">Esc (Esclat)</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Quantitat</label>
          <input type="number" id="field-quantitat" class="form-control" min="1" value="1" />
        </div>
        <div class="form-group" style="display:flex; flex-direction:column; justify-content:flex-end;">
          <label class="toggle-row" style="margin-bottom:0;">
            <span>🏷️ Dte (Descompte)</span>
            <input type="checkbox" id="field-dte" />
          </label>
        </div>
      </div>

      <label class="toggle-row">
        <span>🛒 Posar a la llista de compra ara</span>
        <input type="checkbox" id="field-comprar" checked />
      </label>

      <div class="modal-actions">
        <button type="button" class="btn btn-danger" id="btn-delete" onclick="deleteCurrentItem()" style="display:none;">Esborrar</button>
        <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel·lar</button>
        <button type="button" class="btn btn-primary" onclick="saveModal()">Desar</button>
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbylFLaLHF7kjaCIJ6duBuiafooVQGM4HoL5TUjDDJ-LCfgqYQwUlXMCOyzblj9-dR8q/exec';

    let items = [];
    let currentTab = 'buy'; // 'buy' | 'catalog'
    let superFilter = 'ALL';
    let onlyDte = false;

    const CATEGORY_ORDER = [
      'Fruita i Verdura',
      'Forn i Esmorzar',
      'Carn i Aus',
      'Peix i Marisc',
      'Xarcuteria i Formatges',
      'Làctics i Begudes Vegetals',
      'Pasta, Arròs i Llegums',
      'Rebost i Conserves',
      'Salses i Espècies',
      'Fruits Secs i Aperitius',
      'Dolços i Xocolata',
      'Begudes',
      'Congelats i Preparats',
      'Neteja i Llar',
      'Higiene i Farmàcia',
      'Mascotes',
      'Altres'
    ];

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
    }

    async function loadData(manual = false) {
      const icon = document.getElementById('refresh-icon');
      icon.classList.add('spinning');
      try {
        const res = await fetch(API_URL);
        const json = await res.json();
        if (json.status === 'ok') {
          items = json.items;
          localStorage.setItem('llista_compra_cache', JSON.stringify(items));
          render();
          if (manual) showToast('Llista actualitzada');
        }
      } catch (err) {
        const cached = localStorage.getItem('llista_compra_cache');
        if (cached && items.length === 0) {
          items = JSON.parse(cached);
          render();
        }
        showToast('Sense connexió (mostrant còpia local)');
      } finally {
        icon.classList.remove('spinning');
      }
    }

    async function postAction(payload) {
      try {
        await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
      } catch (err) {
        showToast('Error desant al núvol');
      }
    }

    function switchTab(tab) {
      currentTab = tab;
      document.getElementById('tab-buy').classList.toggle('active', tab === 'buy');
      document.getElementById('tab-catalog').classList.toggle('active', tab === 'catalog');
      document.getElementById('header-title').textContent = tab === 'buy' ? '🛒 A comprar' : '📋 Catàleg habitual';
      document.getElementById('search-container').style.display = tab === 'catalog' ? 'flex' : 'none';
      if (tab === 'catalog') {
        document.getElementById('search-input').focus();
      }
      render();
    }

    function setSuperFilter(sup) {
      superFilter = sup;
      document.querySelectorAll('#super-filters .chip[data-sup]').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.sup === sup);
      });
      render();
    }

    function toggleDteFilter() {
      onlyDte = !onlyDte;
      document.getElementById('dte-chip').classList.toggle('active', onlyDte);
      render();
    }

    function toggleComprar(id) {
      const item = items.find(x => String(x.id) === String(id));
      if (!item) return;
      item.comprar = !item.comprar;
      if (item.comprar && (!item.quantitat || item.quantitat < 1)) {
        item.quantitat = 1;
      }
      localStorage.setItem('llista_compra_cache', JSON.stringify(items));
      render();
      showToast(item.comprar ? `+ ${item.producte}` : `✓ ${item.producte} agafat`);
      postAction({
        action: 'toggleComprar',
        id: item.id,
        comprar: item.comprar,
        quantitat: item.quantitat
      });
    }

    function changeQty(id, delta, event) {
      event.stopPropagation();
      const item = items.find(x => String(x.id) === String(id));
      if (!item) return;
      const newQty = (item.quantitat || 1) + delta;
      if (newQty < 1) {
        toggleComprar(id);
        return;
      }
      item.quantitat = newQty;
      localStorage.setItem('llista_compra_cache', JSON.stringify(items));
      render();
      postAction({
        action: 'updateItem',
        id: item.id,
        quantitat: item.quantitat
      });
    }

    function render() {
      const container = document.getElementById('app-content');
      const pendingCount = items.filter(x => x.comprar).length;
      document.getElementById('pending-badge').textContent = pendingCount;

      const searchTerm = (document.getElementById('search-input').value || '').trim().toLowerCase();

      let filtered = items.filter(item => {
        if (currentTab === 'buy' && !item.comprar) return false;
        if (onlyDte && !item.dte) return false;
        if (superFilter !== 'ALL') {
          // A la vista "A comprar", mostra els del súper seleccionat + els que no tenen súper específic
          if (currentTab === 'buy') {
            if (item.supermercat !== superFilter && item.supermercat !== '') return false;
          } else {
            if (item.supermercat !== superFilter) return false;
          }
        }
        if (currentTab === 'catalog' && searchTerm) {
          return item.producte.toLowerCase().includes(searchTerm) ||
                 item.categoria.toLowerCase().includes(searchTerm);
        }
        return true;
      });

      if (filtered.length === 0) {
        if (currentTab === 'buy') {
          container.innerHTML = `
            <div class="empty-state">
              <div style="font-size:2.4rem;">✅</div>
              <p>No hi ha res pendent amb aquest filtre.</p>
              <button class="btn btn-primary" style="max-width:220px;" onclick="switchTab('catalog')">Afegir del catàleg</button>
            </div>`;
        } else {
          const safeQuery = escapeHtml(document.getElementById('search-input').value.trim());
          container.innerHTML = `
            <div class="empty-state">
              <p>No s'ha trobat "${safeQuery}".</p>
              <button class="btn btn-primary" style="max-width:240px;" onclick="openAddModal('${safeQuery.replace(/'/g, "\\'")}')">+ Crear "${safeQuery}"</button>
            </div>`;
        }
        return;
      }

      // Agrupa per categoria
      const groups = {};
      filtered.forEach(item => {
        const cat = item.categoria || 'Altres';
        if (!groups[cat]) groups[cat] = [];
        groups[cat].push(item);
      });

      const sortedCats = Object.keys(groups).sort((a, b) => {
        const ia = CATEGORY_ORDER.indexOf(a);
        const ib = CATEGORY_ORDER.indexOf(b);
        if (ia === -1 && ib === -1) return a.localeCompare(b);
        if (ia === -1) return 1;
        if (ib === -1) return -1;
        return ia - ib;
      });

      let html = '';
      sortedCats.forEach(cat => {
        const catItems = groups[cat].sort((a, b) => a.producte.localeCompare(b.producte, 'ca'));
        html += `<div class="category-group">
          <div class="category-title">
            <span>${escapeHtml(cat)}</span>
            <span>${catItems.length}</span>
          </div>`;

        catItems.forEach(item => {
          const isChecked = currentTab === 'catalog' && item.comprar;
          const cardClass = currentTab === 'catalog' && item.comprar ? 'item-card in-cart checked-style' : 'item-card';
          const supTag = item.supermercat ? `<span class="tag sup-${escapeHtml(item.supermercat)}">${escapeHtml(item.supermercat)}</span>` : '';
          const dteTag = item.dte ? `<span class="tag tag-dte">Dte</span>` : '';

          html += `
            <div class="${cardClass}">
              <div class="item-left" onclick="toggleComprar('${item.id}')">
                <div class="check-circle">${isChecked ? '✓' : ''}</div>
                <div class="item-info">
                  <span class="item-name">${escapeHtml(item.producte)}</span>
                  ${(supTag || dteTag) ? `<div class="item-tags">${supTag}${dteTag}</div>` : ''}
                </div>
              </div>
              <div class="item-right">
                ${item.comprar ? `
                  <div class="qty-box">
                    <button class="qty-btn" onclick="changeQty('${item.id}', -1, event)">−</button>
                    <span class="qty-val">${item.quantitat}</span>
                    <button class="qty-btn" onclick="changeQty('${item.id}', 1, event)">+</button>
                  </div>` : ''}
                <button class="edit-btn" onclick="openEditModal('${item.id}')" title="Editar">✏️</button>
              </div>
            </div>`;
        });

        html += `</div>`;
      });

      container.innerHTML = html;
    }

    function openAddModal(prefillName = '') {
      document.getElementById('modal-title').textContent = 'Nou article';
      document.getElementById('edit-id').value = '';
      document.getElementById('field-producte').value = prefillName;
      document.getElementById('field-categoria').value = 'Fruita i Verdura';
      document.getElementById('field-supermercat').value = superFilter !== 'ALL' ? superFilter : '';
      document.getElementById('field-quantitat').value = 1;
      document.getElementById('field-dte').checked = onlyDte;
      document.getElementById('field-comprar').checked = true;
      document.getElementById('btn-delete').style.display = 'none';
      document.getElementById('item-modal').classList.add('open');
      setTimeout(() => document.getElementById('field-producte').focus(), 100);
    }

    function openEditModal(id) {
      const item = items.find(x => String(x.id) === String(id));
      if (!item) return;
      document.getElementById('modal-title').textContent = 'Editar article';
      document.getElementById('edit-id').value = item.id;
      document.getElementById('field-producte').value = item.producte;
      document.getElementById('field-categoria').value = item.categoria || 'Altres';
      document.getElementById('field-supermercat').value = item.supermercat || '';
      document.getElementById('field-quantitat').value = item.quantitat || 1;
      document.getElementById('field-dte').checked = !!item.dte;
      document.getElementById('field-comprar').checked = !!item.comprar;
      document.getElementById('btn-delete').style.display = 'block';
      document.getElementById('item-modal').classList.add('open');
    }

    function closeModal() {
      document.getElementById('item-modal').classList.remove('open');
    }

    function closeModalOnBackdrop(e) {
      if (e.target.id === 'item-modal') closeModal();
    }

    async function saveModal() {
      const id = document.getElementById('edit-id').value;
      const producte = document.getElementById('field-producte').value.trim();
      if (!producte) {
        showToast('Escriu el nom del producte');
        return;
      }

      const payload = {
        producte,
        categoria: document.getElementById('field-categoria').value,
        supermercat: document.getElementById('field-supermercat').value,
        quantitat: Math.max(1, parseInt(document.getElementById('field-quantitat').value, 10) || 1),
        dte: document.getElementById('field-dte').checked,
        comprar: document.getElementById('field-comprar').checked
      };

      closeModal();

      if (id) {
        const item = items.find(x => String(x.id) === String(id));
        if (item) Object.assign(item, payload);
        localStorage.setItem('llista_compra_cache', JSON.stringify(items));
        render();
        showToast('Article actualitzat');
        await postAction({ action: 'updateItem', id, ...payload });
      } else {
        const tempId = 'tmp_' + Date.now();
        const newItem = { id: tempId, ...payload };
        items.push(newItem);
        render();
        showToast('Article afegit');
        try {
          const res = await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: 'addItem', ...payload })
          });
          const json = await res.json();
          if (json.id) newItem.id = json.id;
          localStorage.setItem('llista_compra_cache', JSON.stringify(items));
        } catch (err) {
          showToast('Error sincronitzant');
        }
      }
    }

    async function deleteCurrentItem() {
      const id = document.getElementById('edit-id').value;
      if (!id) return;
      items = items.filter(x => String(x.id) !== String(id));
      localStorage.setItem('llista_compra_cache', JSON.stringify(items));
      closeModal();
      render();
      showToast('Article eliminat');
      await postAction({ action: 'deleteItem', id });
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // Recarrega automàtica quan tornes a obrir l'app des de segon pla
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') loadData(false);
    });

    // Arrencada inicial
    const cached = localStorage.getItem('llista_compra_cache');
    if (cached) {
      items = JSON.parse(cached);
      render();
    }
    loadData(false);
  </script>
</body>
</html>
